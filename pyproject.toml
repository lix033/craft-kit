[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "craftkit"
version = "0.3.1"
description = "Study → build → check → refine any software, from the terminal, with your coding agent."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["cli", "coding-agent", "claude-code", "codex", "gemini", "rebuild", "skill"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.40"]

[project.scripts]
craft = "craft_kit.cli:main"
craftkit = "craft_kit.cli:main"
craft-new = "craft_kit.cli:main_new"
craft-run = "craft_kit.cli:main_run"

[tool.setuptools]
packages = ["craft_kit"]

[tool.setuptools.package-data]
craft_kit = ["SKILL.md"]
